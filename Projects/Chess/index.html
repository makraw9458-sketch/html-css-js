<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="board">
        <div class="row">
            <div class="cell" data-row="1" data-column="1">♜</div>   <!-- black rook -->
            <div class="cell" data-row="1" data-column="2">♞</div>   <!-- black knight -->
            <div class="cell" data-row="1" data-column="3">♝</div>   <!-- black bishop -->
            <div class="cell" data-row="1" data-column="4">♛</div>   <!-- black queen -->
            <div class="cell" data-row="1" data-column="5">♚</div>   <!-- black king -->
            <div class="cell" data-row="1" data-column="6">♝</div>   <!-- black bishop -->
            <div class="cell" data-row="1" data-column="7">♞</div>   <!-- black knight -->
            <div class="cell" data-row="1" data-column="8">♜</div>   <!-- black rook -->
        </div>

        <!-- ROW 7 – black pawns -->
        <div class="row">
            <div class="cell" data-row="2" data-column="1">♟</div>
            <div class="cell" data-row="2" data-column="2">♟</div>
            <div class="cell" data-row="2" data-column="3">♟</div>
            <div class="cell" data-row="2" data-column="4">♟</div>
            <div class="cell" data-row="2" data-column="5">♟</div>
            <div class="cell" data-row="2" data-column="6">♟</div>
            <div class="cell" data-row="2" data-column="7">♟</div>
            <div class="cell" data-row="2" data-column="8">♟</div>
        </div>
        
        <div class="row">
            <div class="cell" data-row="3" data-column="1"></div>
            <div class="cell" data-row="3" data-column="2"></div>
            <div class="cell" data-row="3" data-column="3"></div>
            <div class="cell" data-row="3" data-column="4"></div>
            <div class="cell" data-row="3" data-column="5"></div>
            <div class="cell" data-row="3" data-column="6"></div>
            <div class="cell" data-row="3" data-column="7"></div>
            <div class="cell" data-row="3" data-column="8"></div>
        </div>

        <div class="row">
            <div class="cell" data-row="4" data-column="1"></div>
            <div class="cell" data-row="4" data-column="2"></div>
            <div class="cell" data-row="4" data-column="3"></div>
            <div class="cell" data-row="4" data-column="4"></div>
            <div class="cell" data-row="4" data-column="5"></div>
            <div class="cell" data-row="4" data-column="6"></div>
            <div class="cell" data-row="4" data-column="7"></div>
            <div class="cell" data-row="4" data-column="8"></div>
        </div>

        <div class="row">
            <div class="cell" data-row="5" data-column="1"></div>
            <div class="cell" data-row="5" data-column="2"></div>
            <div class="cell" data-row="5" data-column="3"></div>
            <div class="cell" data-row="5" data-column="4"></div>
            <div class="cell" data-row="5" data-column="5"></div>
            <div class="cell" data-row="5" data-column="6"></div>
            <div class="cell" data-row="5" data-column="7"></div>
            <div class="cell" data-row="5" data-column="8"></div>
        </div>

        <div class="row">
            <div class="cell" data-row="6" data-column="1"></div>
            <div class="cell" data-row="6" data-column="2"></div>
            <div class="cell" data-row="6" data-column="3"></div>
            <div class="cell" data-row="6" data-column="4"></div>
            <div class="cell" data-row="6" data-column="5"></div>
            <div class="cell" data-row="6" data-column="6"></div>
            <div class="cell" data-row="6" data-column="7"></div>
            <div class="cell" data-row="6" data-column="8"></div>
        </div>

        <div class="row">
            <div class="cell" data-row="7" data-column="1">♙</div>
            <div class="cell" data-row="7" data-column="2">♙</div>
            <div class="cell" data-row="7" data-column="3">♙</div>
            <div class="cell" data-row="7" data-column="4">♙</div>
            <div class="cell" data-row="7" data-column="5">♙</div>
            <div class="cell" data-row="7" data-column="6">♙</div>
            <div class="cell" data-row="7" data-column="7">♙</div>
            <div class="cell" data-row="7" data-column="8">♙</div>
        </div>

        <!-- ROW 1 (bottom row) – White pieces -->
        <div class="row">
            <div class="cell" data-row="8" data-column="1">♖</div>   <!-- white rook -->
            <div class="cell" data-row="8" data-column="2">♘</div>   <!-- white knight -->
            <div class="cell" data-row="8" data-column="3">♗</div>   <!-- white bishop -->
            <div class="cell" data-row="8" data-column="4">♕</div>   <!-- white queen -->
            <div class="cell" data-row="8" data-column="5">♔</div>   <!-- white king -->
            <div class="cell" data-row="8" data-column="6">♗</div>   <!-- white bishop -->
            <div class="cell" data-row="8" data-column="7">♘</div>   <!-- white knight -->
            <div class="cell" data-row="8" data-column="8">♖</div>   <!-- white rook --> 
        </div>
    </div>

    <script src="./stript.js" type="module"></script>

</body>
</html>
