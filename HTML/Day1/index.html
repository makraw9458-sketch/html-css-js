<!doctype html>

<html lang="en">
  <head>
    <!-- 3. The "Brain": Metadata, title, CSS links. NOT visible on the page. -->
    <meta charset="UTF-8" />
    <!-- Character encoding (handles special characters) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsive design essential -->
    <title>My Web Page</title>
    <!-- Shows in the Browser Tab -->
  </head>

  <body>
    <h1>hi my name is mayank</h1>
    <h2>hi my name is mayank</h2>
    <h3>hi my name is mayank</h3>
    <h4>hi my name is mayank</h4>
    <h5>hi my name is mayank</h5>
    <h6>hi my name is mayank</h6>

    <div style="color: red; font-family: Arial, Helvetica, sans-serif; border: 1px solid;">
      This is a normal block of text.<br/>Browsers ignore extra <strong>spaces</strong> in the code.

      <ol>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
      </ol>
  
      <ul>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
      </ul>
  </body>
</html>
